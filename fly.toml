# fly.toml app configuration file generated for questionnaire-server on 2026-01-18T01:55:29Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'questionnaire-server'
primary_region = 'ord'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
